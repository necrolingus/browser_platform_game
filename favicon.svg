<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Glow -->
  <radialGradient id="g" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#44ff88" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#44ff88" stop-opacity="0"/>
  </radialGradient>
  <circle cx="16" cy="16" r="15" fill="url(#g)"/>
  <!-- Body -->
  <ellipse cx="16" cy="18" rx="10" ry="9" fill="#33cc66"/>
  <ellipse cx="16" cy="18" rx="10" ry="9" fill="url(#bs)"/>
  <defs>
    <radialGradient id="bs" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#66ff99"/>
      <stop offset="100%" stop-color="#229944"/>
    </radialGradient>
  </defs>
  <!-- Eyes -->
  <ellipse cx="12" cy="15" rx="3" ry="3.5" fill="#ffffff"/>
  <ellipse cx="20" cy="15" rx="3" ry="3.5" fill="#ffffff"/>
  <circle cx="12.5" cy="15.5" r="1.5" fill="#111111"/>
  <circle cx="20.5" cy="15.5" r="1.5" fill="#111111"/>
  <!-- Highlight -->
  <ellipse cx="13" cy="13" rx="1" ry="0.7" fill="rgba(255,255,255,0.6)"/>
  <ellipse cx="21" cy="13" rx="1" ry="0.7" fill="rgba(255,255,255,0.6)"/>
  <!-- Mouth -->
  <path d="M13 21 Q16 24 19 21" stroke="#116633" stroke-width="1" fill="none" stroke-linecap="round"/>
